<!doctype html><html lang="zh"><meta charset="utf-8"><title>院递 · 医院配送</title>
<style>body{font:15px system-ui;background:#eef3f6;color:#143348;margin:24px}h1{margin-bottom:4px}main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}.card{background:white;border-radius:16px;padding:20px;margin-top:18px}canvas{width:100%;background:#ddd}table{width:100%;text-align:left;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee}button{padding:8px;margin:4px}small{color:#657886}pre{white-space:pre-wrap;max-height:260px;overflow:auto}#frame{width:100%}section{min-width:0}pre,#robot,td{overflow-wrap:anywhere}table{table-layout:fixed}@media(max-width:900px){main{grid-template-columns:1fr}}</style>
<h1>院递 · 单层医院物资配送</h1><p id="agent">Agent 状态：读取中</p><small>Isaac Sim + Nav2 + AGH/Agnes · 仿真装卸与交接</small>
<main><section><div class="card"><canvas id="map"></canvas><p id="robot"></p></div><div class="card"><img id="frame"><small>仿真展示相机</small></div></section>
<section><div class="card"><h3>配送订单</h3><table><thead><th>订单</th><th>包裹</th><th>目标</th><th>优先级</th><th>状态</th></thead><tbody id="orders"></tbody></table></div>
<div class="card"><h3>订单与接收点</h3><button onclick="normal()">新建普通配送</button><button onclick="receiver(false)">关闭 A 接收点</button><button onclick="receiver(true)">恢复 A 接收点</button><button onclick="urgent()">插入紧急订单</button><p id="control"></p></div>
<div class="card"><h3>执行记录</h3><pre id="events"></pre></div><div class="card"><h3>验证报告</h3><pre id="report"></pre></div></section></main>
<script>
let state={},img=new Image;img.src='/map.png';let canvas=document.getElementById('map'),ctx=canvas.getContext('2d');
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function xy(x,y){let m=state.map||{origin:[-49.625,-4.675],resolution:.05};return [(x-m.origin[0])/m.resolution,canvas.height-(y-m.origin[1])/m.resolution]}
function draw(){if(!img.complete||!img.naturalWidth)return;canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;ctx.drawImage(img,0,0);ctx.lineWidth=4;ctx.strokeStyle='#19a8a1';ctx.beginPath();(state.trajectory||[]).forEach((p,i)=>{let q=xy(p[1],p[2]);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.stroke();for(let [k,p] of Object.entries(state.stations||{})){let q=xy(p.x,p.y);ctx.fillStyle='#16394f';ctx.beginPath();ctx.arc(...q,8,0,7);ctx.fill();ctx.font='24px sans-serif';ctx.fillText(p.label||k,...[q[0]+10,q[1]])}if(state.pose){let q=xy(state.pose.x,state.pose.y);ctx.fillStyle='#f18539';ctx.beginPath();ctx.arc(...q,12,0,7);ctx.fill()}}
async function post(url,data){let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let j=await r.json();document.getElementById('control').textContent=JSON.stringify(j);return j}
function receiver(v){return post('/api/admin/receiver',{station_id:'station_a',available:v})}
function normal(){let id='normal_'+Date.now();return post('/api/tool',{name:'create_orders',arguments:{operation_id:id,orders:[{order_id:id,package_id:'P_'+id,pickup_station:'depot',dropoff_station:'station_a',priority:'normal',deadline_sim:state.sim_time+300}]}})}
function urgent(){let id='urgent_'+Date.now();return post('/api/tool',{name:'create_orders',arguments:{operation_id:id,orders:[{order_id:id,package_id:'P_'+id,pickup_station:'depot',dropoff_station:'station_c',priority:'urgent',deadline_sim:state.sim_time+180}]}})}
async function tick(){try{state=await(await fetch('/api/state')).json();let agent=await(await fetch('/api/agent')).json();document.getElementById('agent').textContent='Agnes 调度：'+({idle:'待命',thinking:'正在决策',decision_completed:'已执行本轮决策',verifying:'核验回执',stopped:'已停止',stopped_at_budget:'达到运行上限',model_error:'模型调用异常',experiment_finished:'实验运行已结束',waiting_for_service:'等待服务',not_started:'未启动'}[agent.phase]||agent.phase||'未知')+' · 已决策 '+(agent.turns||0)+' 次';document.getElementById('robot').textContent='ROS导航 '+(state.navigation_ready?'就绪':'等待')+' · '+JSON.stringify(state.navigation)+' · 载货 '+Object.values(state.orders).filter(o=>o.loaded).length+'/2 · 仿真时间 '+state.sim_time.toFixed(1);document.getElementById('orders').innerHTML=Object.values(state.orders).map(o=>'<tr>'+[o.order_id,o.package_id,state.stations[o.dropoff_station].label,{normal:'普通',urgent:'紧急'}[o.priority],{pending:'待取货',onboard:'运输中',deferred:'已延后',delivered:'已交接',failed:'未交付'}[o.status]].map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('');document.getElementById('events').textContent=state.events.slice(-12).map(e=>JSON.stringify(e)).join('\n');document.getElementById('report').textContent=JSON.stringify(await(await fetch('/api/report')).json(),null,2);draw();document.getElementById('frame').src='/frame.jpg?t='+Date.now()}catch(e){document.getElementById('robot').textContent=e}setTimeout(tick,1000)}tick();
</script></html>
